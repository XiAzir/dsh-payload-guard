- insert:
    - id: payload-guard
      name: dsh-payload-guard
      # config:
      #   # 主开关。true（默认）= 请求体超限后换本地路径占位文本并自动重试；
      #   # false = 完全退回 DSH 原生行为：超限直接失败，图片预算仍是适配器默认的 20 MiB。
      #   enabled: true
      #   # 每次超限后一次性移出「剩余未移出图片」的比例（0.05-1），默认 0.5。
      #   # 保留一半是刻意的：移出的图会变成占位文本，模型需主动回读才能再看见。
      #   offloadRatio: 0.5
      #   # 单次最多移出多少张，默认 12。
      #   maxOffloadPerRetry: 12
      #   # 同一回合内最多自动恢复几次，默认 5。按回合而非按 step 计，
      #   # 否则换 step 会重置预算，"回读→超限→再卸载"的循环就无法收敛。
      #   maxRecoveriesPerTurn: 5
      #   # 是否注入「已发生卸载」的行为提示，默认 true。
      #   # 提示是固定文本、内容不含可变计数，因此不会随恢复次数堆积快照。
      #   notice: true
